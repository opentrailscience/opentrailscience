<!doctype html>
<!--
  Source of public/og-image.png, the link preview for WhatsApp, Reddit, Slack etc.:
  deliberately just the tab icon (public/img/cairn-icon.svg) on the paper background, shown small
  (twitter:card "summary"), not a big share card.
  Regenerate after editing: screenshot it at a 512x512 viewport with a headless browser script,
  e.g. Puppeteer: page.setViewport({ width: 512, height: 512 }), page.goto("file://…/src/og-image.html"),
  page.screenshot({ path: "public/og-image.png" }). (`chrome --headless --screenshot` is not enough:
  its --window-size includes the toolbar, so the bottom of the image is cut off.)
-->
<html lang="en"><head><meta charset="utf-8"><title>Open Trail Science preview</title><style>
html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #f3f1ea; }
body { display: grid; place-items: center; }
img { width: 340px; height: 340px; }
</style></head><body>
<img src="../public/img/cairn-icon.svg" alt="">
</body></html>
