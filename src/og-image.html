<!doctype html>
<!--
  Source of public/og-image.png, the link preview for WhatsApp, Reddit, Slack etc.
  Regenerate (1200x630) after editing:
    firefox --headless --window-size=1200,630 --screenshot public/og-image.png "file://$PWD/src/og-image.html"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Trail Science preview</title>
<style>
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url('../public/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 700; src: url('../public/fonts/ibm-plex-sans-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url('../public/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }
</style>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'IBM Plex Sans', sans-serif; color: #181b1f; background: #f2f2ef; position: relative; }
  .topo { position: absolute; top: 0; right: 0; width: 520px; height: 630px; object-fit: cover; object-position: left bottom; }
  .content { position: absolute; left: 80px; top: 64px; width: 760px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 72px; height: 72px; }
  .wordmark { font-size: 30px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.1; }
  .wordmark span { color: #1f4f8f; }
  .tagline { font-size: 19px; color: #555c63; }
  .nowrap { white-space: nowrap; }
  h1 { font-size: 68px; line-height: 1.06; font-weight: 700; letter-spacing: -0.02em; margin: 52px 0 0; }
  p { font-size: 26px; color: #3c4248; margin: 24px 0 0; line-height: 1.45; }
  .trails { display: flex; gap: 10px; margin-top: 32px; }
  /* Like the trail stones on the home page: a tint of the accent, bordered in a deeper shade. */
  .trails span { --c: #ffffff; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 19px; color: #181b1f; background: color-mix(in srgb, var(--c) 36%, #ffffff); border: 1.5px solid color-mix(in srgb, var(--c) 60%, #181b1f); border-radius: 6px; padding: 6px 16px; }
  .trails span:nth-child(4n+1) { --c: #8db89c; }
  .trails span:nth-child(4n+2) { --c: #e39a72; }
  .trails span:nth-child(4n+3) { --c: #93b4d6; }
  .trails span:nth-child(4n+4) { --c: #e5c77a; }
  .trails span:last-child { --c: #ffffff; border: 1.5px dashed #555c63; }
  .url { position: absolute; left: 80px; bottom: 44px; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 21px; }
</style>
</head>
<body>
  <img class="topo" src="../public/img/hero-topo.svg" alt="">
  <div class="content">
    <div class="brand">
      <img src="../public/img/cairn-logo.svg" alt="">
      <div>
        <div class="wordmark">OPEN TRAIL <span>SCIENCE</span></div>
        <div class="tagline">Thru-Hiker Survey</div>
      </div>
    </div>
    <h1>How does your <span class="nowrap">thru-hike</span> compare?</h1>
    <p>About 10 minutes, no names or accounts. Every answer goes into a free, open dataset on long-distance hiking.</p>
    <div class="trails"><span>PCT</span><span>AT</span><span>CDT</span><span>TMB</span><span>CAMINO</span><span>+ more</span></div>
  </div>
  <div class="url">opentrailscience.org</div>
</body>
</html>
