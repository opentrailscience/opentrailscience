[build]
  publish = "public"
  functions = "netlify/functions"
  # Builds public/css/tailwind.css and exports the dataset to public/data/
  command = "npm run build"

[functions]
  node_bundler = "esbuild"

# Once a day: triggers a snapshot rebuild if answers are still waiting
# (netlify/functions/utils/rebuild.js). Needs BUILD_HOOK_URL, see docs/DEVELOPMENT.md.
[functions."snapshot-nightly"]
  schedule = "@daily"

# Every 1 January: delete all feedback and trail suggestions, so none is kept longer than 12 months
# (feedback has no date, see netlify/functions/feedback-cleanup.js).
[functions."feedback-cleanup"]
  schedule = "0 4 1 1 *"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000
  publish = "public"
  autoLaunch = false

# The /api/* routes are set in the functions themselves (config.path in
# netlify/functions/*.js), together with their rate limits.

# Direct clean URLs for static dataset downloads
[[redirects]]
  from = "/download/csv"
  to = "/data/thru_hiker_survey_dataset.csv"
  status = 200

[[redirects]]
  from = "/download/json"
  to = "/data/thru_hiker_survey_dataset.json"
  status = 200

# The pages of the site: one page (index.html) that shows the view for its address
# (VIEW_PATHS in src/app/core.js; test/entrypoints.test.js checks that both lists match).
# No catch-all: any other address gets public/404.html with a real 404 status.
[[redirects]]
  from = "/survey"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/thanks"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/insights"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dataset"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200
